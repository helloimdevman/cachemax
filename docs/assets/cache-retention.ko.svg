<desc id="desc">2026-09-29 · 3분 간격 · 호스트·시간별 2쌍 비교. 위: cachemax 미사용. 아래: cachemax 사용. 숫자는 2회의 범위이며 막대 끝의 옅은 부분이 그 범위입니다. 관측된 입력 비율이지 캐시 적중 확률이 아닙니다. ¹ 예열 후 유지 요청 + 복귀 요청을 미사용과 비교한 완료 쌍의 범위. CLI 달러 추정치는 구독 청구액과 다릅니다. † Claude 2시간: 유지 요청 31회 완료 후 중단. 복귀 값은 참고용으로 표시하고 ¹에서 제외했습니다.</desc>
